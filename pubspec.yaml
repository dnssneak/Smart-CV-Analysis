name: smart_cv_analysis
description: AI-Powered Resume Reviewer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  
  # State Management
  provider: ^6.1.1
  
  # UI & Animations
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  
  # File Handling
  file_picker: ^6.1.1
  pdfx: ^2.6.0
  docx_to_text: ^1.0.1
  path_provider: ^2.1.1
  
  # Networking
  dio: ^5.4.0
  
  # Utils
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
    - assets/lottie/