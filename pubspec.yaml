name: smart_cv_analysis
description: AI-Powered Resume Reviewer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # State Management
  provider: ^6.1.2

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # File Handling
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^26.2.14
  docx_to_text: ^1.0.1
  path_provider: ^2.1.4

  # Networking
  dio: ^5.7.0

  # Utils
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.5
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
    - assets/lottie/